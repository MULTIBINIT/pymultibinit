# Example MULTIBINIT Configuration File - Simple Format
# ====================================================
#
# This is the simplest format for configuring a MULTIBINIT potential.
# Lines starting with # are comments.
#
# Required: Specify either abi_file OR ddb_file
# Use either : or = as separator

# Option 1: Use existing .abi input file
# abi_file: path/to/input.abi

# Option 2: Specify DDB and XML files directly
ddb_file: system_DDB
sys_file: system.xml

# Optional: Coefficient XML file (if not in sys_file)
# coeff_file: coefficients.xml

# Optional: Supercell dimensions (default: 1 1 1)
ncell: 2 2 2

# Optional: q-point grid (default: 1 1 1)
ngqpt: 4 4 4

# Optional: Dipole-dipole interactions (default: 1)
# 0 = off, 1 = on
dipdip: 1

# Optional: Backend selection (default: ctypes)
# backend: ctypes

# Optional: Use atomic units (default: false)
# If false, uses Angstrom/eV (recommended for ASE)
# use_atomic_units: false

# Optional: Automatic atom matching (default: true)
# auto_match_atoms: true

# Optional: Matching tolerance in Angstrom (default: 0.1)
# match_tolerance: 0.1
