# Example MULTIBINIT Configuration File - INI Format
# ==================================================
#
# This format uses INI-style sections for better organization.
# You can use both = or : as separator.

[files]
# Required: Specify either abi_file OR ddb_file
# Option 1: Use existing .abi input file
# abi_file = path/to/input.abi

# Option 2: Specify DDB and XML files directly
ddb_file = system_DDB
sys_file = system.xml

# Optional: Coefficient XML file
# coeff_file = coefficients.xml

[parameters]
# Supercell dimensions (default: 1 1 1)
# Can use spaces or commas: "2 2 2" or "2,2,2"
ncell = 2 2 2

# q-point grid (default: 1 1 1)
ngqpt = 4 4 4

# Dipole-dipole interactions (default: 1)
# 0 = off, 1 = on
dipdip = 1

[backend]
# Backend selection: ctypes or cffi (default: ctypes)
backend = ctypes

# Path to libabinit.so/dylib (optional, auto-detected if not specified)
# lib_path = /path/to/libabinit.so

# Use atomic units (Bohr/Hartree) instead of Angstrom/eV (default: false)
# Recommended: keep false for ASE compatibility
use_atomic_units = false

[atom_matching]
# Automatic atom matching and reordering (default: true)
# Recommended: keep enabled for safety
auto_match_atoms = true

# Matching tolerance in Angstrom or Bohr (default: 0.1)
# Maximum distance for considering two atoms as matching
match_tolerance = 0.1
