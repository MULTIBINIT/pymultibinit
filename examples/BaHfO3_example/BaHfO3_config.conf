# MULTIBINIT Configuration File for BaHfO3 Example
# ================================================
#
# This configuration file specifies all parameters needed to
# initialize the MULTIBINIT effective potential for BaHfO3.
#
# You can use this with:
#   pot = MultibinitPotential.from_config_file("BaHfO3_config.conf")
#   calc = MultibinitCalculator.from_config_file("BaHfO3_config.conf")

[files]
# DDB file (derivative database) from DFPT calculation
# Contains interatomic force constants and Born effective charges
ddb_file = BaHfO3_DDB

# System XML file with effective Hamiltonian coefficients
# Generated from MULTIBINIT training or provided separately
sys_file = BaHfO3.xml

# Optional: If using .abi file instead of explicit parameters
# Uncomment this and comment out the [parameters] section
# abi_file = BaHfO3.abi

[parameters]
# Supercell dimensions for the simulation
# Creates a 2x2x2 supercell from the primitive cell
# BaHfO3 primitive: 5 atoms → 2x2x2 supercell: 40 atoms
ncell = 2 2 2

# Q-point grid used in the DDB file
# Must match the grid from your DFPT calculation
ngqpt = 4 4 4

# Dipole-dipole interactions (important for polar materials)
# 1 = enable (recommended for BaHfO3 and other ferroelectrics)
# 0 = disable
dipdip = 1

[backend]
# Optional: Explicit path to libabinit.so/dylib
# If not specified, pymultibinit will search in standard locations
# lib_path = /path/to/libabinit.so

# Use atomic units (Bohr/Hartree) instead of Angstrom/eV
# false = Angstrom/eV (recommended for ASE compatibility)
# true = Bohr/Hartree
use_atomic_units = false

[atom_matching]
# Automatic atom order matching and PBC handling
# Recommended: keep enabled to avoid atom ordering issues
auto_match_atoms = true

# Matching tolerance in Angstrom
# Maximum distance for considering atoms as matching
match_tolerance = 0.1

#---------------------------------------------------------------
# Notes:
#---------------------------------------------------------------
# 1. File paths are relative to this config file's directory
#
# 2. For BaHfO3, the typical structure is:
#    - Primitive cell: 5 atoms (1 Ba, 1 Hf, 3 O)
#    - With ncell = 2 2 2: 40 atoms total
#    - Lattice: ~3.99 Å cubic (room temperature)
#
# 3. The DDB and XML files must be generated beforehand using
#    ABINIT's DFPT calculations and MULTIBINIT training
#
