[project]
name = "pymultibinit"
version = "0.3.6"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Xu He", email = "x.he@uliege.be" }
]
requires-python = ">=3.10"
dependencies = [
    "ase>=3.26.0",
    "cffi>=2.0.0",
    "numpy>=2.2.6",
    "phonopy>=3.0.0",
    "scipy>=1.15.3",
]

[project.scripts]
mbtools = "pymultibinit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
